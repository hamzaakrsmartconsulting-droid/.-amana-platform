# =============================================================================
# AMANA Patrimoine - Stack production EC2
#
# Usage EC2 (OBLIGATOIRE : --env-file pour inliner NEXT_PUBLIC_* au build) :
#   docker compose --env-file .env.production build --no-cache amana
#   docker compose --env-file .env.production up -d amana
#   docker compose logs -f amana
#
# Sans --env-file, NEXT_PUBLIC_* sont vides → build ou runtime cassés.
# =============================================================================

services:
  amana:
    image: amana-platform:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* inlinés au build (sinon undefined côté client).
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_ORIAS_NUM: ${NEXT_PUBLIC_ORIAS_NUM}
        NEXT_PUBLIC_CALENDLY_URL: ${NEXT_PUBLIC_CALENDLY_URL}
        NEXT_PUBLIC_CALENDLY_PREMIUM_URL: ${NEXT_PUBLIC_CALENDLY_PREMIUM_URL}
    container_name: amana
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      # 127.0.0.1 = exposé uniquement au host (Nginx).
      # Ne JAMAIS exposer 3000 publiquement.
      - "127.0.0.1:3000:3000"
    mem_limit: 2g
    mem_reservation: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - amana-net

  # Sidecar cron : remplace les crons Vercel (vercel.json).
  # Appelle les routes /api/cron/* avec le CRON_SECRET en Bearer.
  cron:
    image: alpine:3.20
    container_name: amana-cron
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - amana
    command: >
      sh -c "
      apk add --no-cache curl tzdata &&
      cp /usr/share/zoneinfo/Europe/Paris /etc/localtime &&
      echo 'Europe/Paris' > /etc/timezone &&
      printf '0 9 1 */3 * curl -fsS -H \"Authorization: Bearer %s\" %s/api/cron/reporting-trimestriel >> /var/log/cron.log 2>&1\n0 9 1 1 * curl -fsS -H \"Authorization: Bearer %s\" %s/api/cron/bilan-annuel >> /var/log/cron.log 2>&1\n' \"$$CRON_SECRET\" \"$$NEXT_PUBLIC_APP_URL\" \"$$CRON_SECRET\" \"$$NEXT_PUBLIC_APP_URL\" > /etc/crontabs/root &&
      touch /var/log/cron.log &&
      crond -f -l 2 -L /var/log/cron.log
      "
    networks:
      - amana-net

networks:
  amana-net:
    driver: bridge
