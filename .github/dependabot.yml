version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
      types:
        patterns:
          - "@types/*"
      dev:
        patterns:
          - eslint
          - eslint*
          - vitest
          - "@vitest/*"
          - "@playwright/*"
    labels:
      - dependencies
    reviewers:
      - MohamedMosbahi

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    reviewers:
      - MohamedMosbahi
